server {
    listen 80;
    listen [::]:80;
    server_name shreenathjitradelinks.com www.shreenathjitradelinks.com;

    return 301 https://shreenathjitradelinks.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.shreenathjitradelinks.com;

    ssl_certificate /etc/letsencrypt/live/shreenathjitradelinks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shreenathjitradelinks.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://shreenathjitradelinks.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shreenathjitradelinks.com;

    ssl_certificate /etc/letsencrypt/live/shreenathjitradelinks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shreenathjitradelinks.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Owner-uploaded product images live outside Next.js's build output, so
    # serve this public, image-only directory directly and avoid proxying it.
    location /media/uploads/ {
        alias /var/www/shreenathji-trade-links/public/media/uploads/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }
}
